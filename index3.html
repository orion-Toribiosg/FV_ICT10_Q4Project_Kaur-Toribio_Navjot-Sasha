<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My ICT Project</title>
    <!-- PyScript Assets -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap');

body{
    font-family:'Orbitron', sans-serif;
    background:#050816;
    background-image:
    radial-gradient(circle at top left, rgba(0,255,255,0.15), transparent 30%),
    radial-gradient(circle at bottom right, rgba(255,0,255,0.15), transparent 30%);
    padding:40px;
    color:white;
}

h1{
    color:#00ffff;
    text-shadow:
    0 0 10px #00ffff,
    0 0 20px #00ffff;
}

.gallery{
    display:flex;
    flex-wrap:wrap;
    gap:25px;
    justify-content:center;
}

.card{
    background:rgba(15,15,35,0.9);
    border:1px solid #00ffff55;
    border-radius:20px;
    overflow:hidden;
    width:300px;
    transition:0.3s;
    box-shadow:0 0 20px rgba(0,255,255,0.2);
}

.card:hover{
    transform:translateY(-8px) scale(1.02);
    box-shadow:
    0 0 25px #00ffff,
    0 0 35px #ff00ff;
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card-body{
    padding:18px;
}

.card-body h3{
    color:#ff00ff;
    margin-bottom:10px;
}

.card-body p{
    color:#d1d5db;
    line-height:1.5;
}

.navbar{
    background:rgba(10,10,25,0.8);
    border:1px solid #00ffff55;
    border-radius:15px;
    padding:18px;
    margin-bottom:40px;
    box-shadow:0 0 20px #00ffff33;
}

.navbar ul{
    list-style:none;
    display:flex;
    justify-content:center;
    gap:30px;
}

.navbar a{
    color:#00ffff;
    text-decoration:none;
    padding:10px 15px;
    border-radius:10px;
    transition:0.3s;
}

.navbar a:hover{
    background:#ff00ff;
    box-shadow:0 0 15px #ff00ff;
}
    </style>
</head>
<body>
<nav class="navbar">
    <ul>
        <li><a href="index.html">Classmate System</a></li>
        <li><a href="index2.html">Attendance Checker</a></li>
        <li><a href="index3.html">SY 25-26 Pics</a></li>
    </ul>
</nav>
    <h1 style="text-align:center; margin-bottom: 40px;">SY 2025-2026 Activities</h1>
    
    <!-- This is where PyScript will inject the boxes -->
    <div id="gallery-container" class="gallery"></div>

    <py-config>
        packages = ['numpy', 'matplotlib']
    </py-config>
<py-script src="main.py"></py-script>

</body>
</html>
